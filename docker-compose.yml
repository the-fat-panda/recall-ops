services:
  orders-api:
    build:
      context: .
      dockerfile: backend/sandbox/Dockerfile
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - "./certs/root.crt:/certs/root.crt:ro"
  agent:
    build:
      context: .
      dockerfile: backend/agent/Dockerfile
    env_file:
      - .env
    volumes:
      - "./certs/root.crt:/certs/root.crt:ro"
  agent-api:
    build:
      context: .
      dockerfile: backend/agent/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - "./certs/root.crt:/certs/root.crt:ro"
    command: ["uvicorn", "backend.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - agent-api
      - orders-api
